<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PERSEPOLIS</title><script src="https://telegram.org/js/telegram-web-app.js"></script><link rel="stylesheet" href="/styles.css"></head><body><div class="app"><header><div class="mark">𐎱𐎠𐎼𐎿𐎠</div><div><small>ACHAEMENID MINING</small><h1>PERSEPOLIS</h1><p>Mine PERS. Rise through 30 levels.</p></div></header><section class="card balance"><small>BALANCE</small><strong id="balance">0.000000</strong><i>PERS</i><div class="stats"><span>LEVEL<b id="level">1/30</b></span><span>SPEED<b id="speed">0.00100</b></span><span>ENERGY<b id="energy">500/500</b></span></div></section><section class="card"><div class="row"><div><small>MINING SESSION</small><h2 id="status">Stopped</h2></div><b id="timer">08:00:00</b></div><div class="bar"><i id="progress"></i></div><p id="reward">0.000000 PERS</p><button id="mine">START MINING</button></section><div class="grid"><button class="card act" id="daily">🎁<b>Daily</b><small>+2 PERS</small></button><button class="card act" id="upgrade">⬆️<b>Upgrade</b><small id="cost">500 PERS</small></button><button class="card act" id="tap">⚡<b>Energy Tap</b><small>-5 energy</small></button><button class="card act" id="wallet">💎<b>Wallet</b><small id="walletText">Not connected</small></button></div><section class="card"><small>LEADERBOARD</small><div id="lb"></div></section><section class="card"><small>LEDGER</small><div id="ledger"></div></section><div id="toast"></div></div><script src="/app.js"></script></body></html>
